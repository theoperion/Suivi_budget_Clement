<style>

.nivbar{height:10px;border-radius:5px;background:var(--track);margin-top:8px;overflow:hidden}.nivbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#E8A33A,var(--bad));border-radius:5px}

.sxp{font-family:var(--mono);font-size:9.5px;letter-spacing:.6px;text-align:right;line-height:1.35;flex:none}
.coll{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cit{border:1.5px solid var(--rule);border-radius:10px;padding:6px 4px 7px;text-align:center;background:var(--card)}.cit.on{border-color:var(--ink);box-shadow:0 0 0 1.5px var(--ink) inset}
.cit.verr{opacity:.45}.cit.verr .cprev{filter:grayscale(1) blur(1.5px)}.cprev svg{width:100%;height:auto;display:block}.cit b{display:block;font-size:11.5px;font-weight:600;margin-top:2px}.cit small{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.8px;color:var(--ink3)}
.bil.wr b{font-size:15px}
.play{width:100%;height:46px;border-radius:12px;background:linear-gradient(90deg,#1D9E75,#2B7FD8,#7B5BD6,#D85A30);color:#fff;font-family:var(--mono);font-weight:700;letter-spacing:1.5px;font-size:13px;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px}.play span{font-size:16px}
.story{position:fixed;inset:0;z-index:90;color:#fff;transition:background .4s;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 14px) 22px 30px;user-select:none;-webkit-user-select:none}
.sbars{display:flex;gap:4px}.sbars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}.sbars b{display:block;height:100%;width:0;background:#fff}
.sclose{position:absolute;top:calc(env(safe-area-inset-top) + 26px);right:16px;color:#fff;font-size:22px;z-index:3;width:40px;height:40px}
.sbody{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:left}
.sbody.in>*{animation:sIn .55s cubic-bezier(.2,.9,.3,1.2) both}.sbody.in>*:nth-child(2){animation-delay:.12s}.sbody.in>*:nth-child(3){animation-delay:.24s}
@keyframes sIn{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
.sbody small{font-family:var(--mono);letter-spacing:3px;font-size:13px;opacity:.85}
.sbig{font-family:var(--mono);font-weight:700;font-size:clamp(40px,14vw,72px);line-height:1.05;word-break:break-word}

.sstamp{align-self:flex-start;font-family:var(--mono);font-weight:800;font-size:clamp(30px,10vw,48px);letter-spacing:3px;border:5px solid #fff;padding:8px 16px;border-radius:10px;transform:rotate(-5deg)}
.sbarsl{display:flex;flex-direction:column;gap:14px}.sbarsl div{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;font-size:16px}.sbarsl i{grid-column:1/3;height:14px;border-radius:7px;background:rgba(255,255,255,.95);width:var(--w);animation:grow 1s ease-out both}.sbarsl b{font-family:var(--mono)}
@keyframes grow{from{width:0}}
.szone{position:absolute;top:70px;bottom:0;z-index:2}.sprev{left:0;width:30%}.snext{right:0;width:70%}
.wrap{margin-top:8px}.whero{text-align:center;padding:16px 8px;border-radius:14px;background:linear-gradient(135deg,#2C2C2A,#4A3A2A);color:#F1EFE8}.whero small{font-family:var(--mono);font-size:11px;letter-spacing:2px;opacity:.7}.whero b{display:block;font-family:var(--mono);font-size:40px;font-weight:700;margin:4px 0;color:#9BE5B4}.whero b.c-bad{color:#F0997B}.whero span{font-size:13px;opacity:.85}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.wt{border:1.5px solid var(--rule);border-radius:10px;padding:9px}.wt small{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:1px;color:var(--ink3)}.wt b{display:block;font-family:var(--mono);font-size:19px;font-weight:700;margin-top:2px}.wt span{font-size:11.5px;color:var(--ink2)}
.wline{font-size:13px;color:var(--ink2);margin-top:10px;line-height:1.5}.wline b{color:var(--ink)}
.part{border:1.5px dashed var(--rule);border-radius:10px;padding:10px;margin:0 0 10px}
.series{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.ser{border:1.5px dashed var(--rule);border-radius:8px;padding:6px 8px;display:flex;align-items:center;gap:8px;font-family:var(--mono);min-width:0}

.bar.an{position:relative;height:7px;overflow:visible;border-radius:2px}

.bar.an::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(to right,transparent 0,transparent calc(100%/12 - 1.5px),var(--paper) calc(100%/12 - 1.5px),var(--paper) calc(100%/12));pointer-events:none}

.stamp{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:1px;border:1.5px solid;padding:1px 5px;border-radius:2px;display:inline-block;transform:rotate(-4deg)}
.s-ok{color:var(--okInk);border-color:var(--ok)}.s-warn{color:var(--warnInk);border-color:var(--warn)}.s-bad{color:var(--badInk);border-color:var(--bad);transform:rotate(3deg)}
.c-ok{color:var(--okInk)}.c-warn{color:var(--warnInk)}.c-bad{color:var(--badInk)}.c-mute{color:var(--ink3)}
.alert{display:block;width:100%;text-align:left;border:1.5px solid var(--bad);color:var(--badInk);border-radius:6px;padding:10px 12px;font-size:13px;margin-top:6px}

body.accent .fab{background:var(--acc);color:#fff}body.accent .tab.on{color:var(--acc)}body.accent .tab.on svg{stroke:var(--acc)}body.accent .seg button.on{box-shadow:inset 0 -3px 0 var(--acc)}body.accent .niv{border-color:var(--acc)}

<script>
/* ================= CONFIG ================= */
const VERSION = '6.1';
// Fonctionnalités masquables (Réglages). Masquer = ne plus afficher ; les données continuent d'être enregistrées.
const FONCS = [
  ['pj', 'Montant par jour', 'sous le grand chiffre et à la saisie'],
  ['reperes', 'Repères du jour', 'trait sur la jauge et les budgets du mois'],
  ['pointbas', 'Point bas prévu', 'courbe du solde jusqu\'à fin du mois prochain'],
  ['avances', 'Avances et « On te doit »', 'payer pour d\'autres et suivre les remboursements'],
  ['defi', 'Défi du mois', ''],
  ['series', 'Séries', 'jours sans dépense, mois dans le vert, budgets tenus'],
  ['bilan', 'Bilans mensuels', 'récap du 1er au 5 et historique'],
  ['jeu', 'Niveaux, succès et collection', 'XP, jauges, thèmes et cosmétiques à débloquer'],
  ['saison', 'Défis saisonniers', 'novembre sobre, calendrier de l\'avent…'],
  ['semaine', 'Défi de la semaine', 'proposé chaque lundi'],
  ['escalier', "Escalier de l'épargne", 'objectif d\'épargne qui monte'],
  ['tirelires', 'Tirelires à projet', ''],
  ['objectif', "Objectif d'épargne de l'année", ''],
  ['resume', 'Résumé du dimanche', 'bandeau le dimanche soir'],
  ['alertes', 'Alertes futées', 'sur l\'accueil'],
  ['voyage', 'Mode voyage', '']];
const on = k => !LS.get('off', []).includes(k);
const progresVisible = () => on('defi') || on('series') || on('bilan') || on('jeu') || ['saison', 'semaine', 'escalier', 'tirelires', 'voyage', 'objectif', 'resume'].some(k => ouvert(k)) || FEAT.some(f => !dispo(f[0]));
// Optionnel : lien proposé par défaut au premier lancement. Laisser vide pour la version commune.
const API_DEFAUT = 'https://script.google.com/macros/s/AKfycbzhEngMSVYWODEjvcZMUpjwJNvzTkTKbI0hWviNhVBRsUhKlR_2taEVnM6-Ds-1QRnaSg/exec';
const API_ATTENDUE = '3.5'; // version minimale du script ; les versions plus récentes sont acceptées

/* ================= OUTILS ================= */
const IN_GAS = typeof google !== 'undefined' && google.script && google.script.run;
const $ = s => document.querySelector(s);
const LS = {
  get(k, d) { try { const v = localStorage.getItem('jauge-clem.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('jauge-clem.' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('jauge-clem.' + k); } catch (e) {} }
};
const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
const MOIS_N = MOIS.map(norm);
const moisLabel = (y, m) => MOIS[m - 1][0].toUpperCase() + MOIS[m - 1].slice(1) + ' ' + y;
function parseMois(s) { const t = norm(s).match(/^([a-z]+)\s+(\d{4})$/); if (!t) return null; const i = MOIS_N.indexOf(t[1]); return i < 0 ? null : { y: +t[2], m: i + 1 }; }
const F2 = new Intl.NumberFormat('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const F0 = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 0 });
const e0 = v => F0.format(Math.round(v)).replace(/ /g, ' ') + ' €';
const e2 = v => F2.format(v).replace(/ /g, ' ');
const sg0 = v => (v > 0.5 ? '+' : '') + e0(v);
const neg2 = v => Math.abs(v) < 0.005 ? e2(0) : '−' + e2(v);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const dim = (y, m) => new Date(y, m, 0).getDate();
const VAR = ['Vie courante', 'Loisirs', 'Divers'], FIX = ['Charges fixes', 'Abonnements'];
// Argent avancé pour d'autres : + quand tu paies pour quelqu'un, − quand il te rembourse. Libellé « Prénom · objet ».
const CAT_AV = 'Avances (on me doit)', estAv = n => /^Avances/i.test(String(n || ''));

/* ================= ÉTAT ================= */
let now = new Date();
const S = {
  data: null, journal: [], queue: LS.get('queue', []), key: LS.get('key', ''), api: (() => { const ok = /\/exec\/?$/.test(API_DEFAUT); if (ok && LS.get('apiDefautVu', '') !== API_DEFAUT) { LS.set('apiDefautVu', API_DEFAUT); LS.set('api', API_DEFAUT); } return LS.get('api', '') || (ok ? API_DEFAUT : ''); })(),
  tab: 'home', y: now.getFullYear(), m: now.getMonth() + 1,
  filtre: { cat: null, q: '' }, busy: false, lastFetch: 0, lastFrac: 0, anomOpen: false, form: null
};
(function chargerCache() {
  const c = LS.get('cache', null);
  if (c && c.data) { S.data = c.data; S.journal = c.journal || []; }
})();
function prepData(d) {
  (d.echeancier || []).forEach(e => { e.id = 'e' + e.ligne; e.srv = { lib: e.lib, cat: e.cat, montant: e.montant }; });
  (d.avenir || []).forEach(a => { a.id = 'a' + a.row; const p = parseMois(a.mois); a.y = p ? p.y : null; a.m = p ? p.m : null; a.srv = { lib: a.lib, cat: a.cat, montant: a.montant }; });

}
function sauver() { LS.set('cache', { data: S.data, journal: S.journal }); LS.set('queue', S.queue); }
function entriesFromData(d) {
  return d.journal.map(r => { const p = parseMois(r.mois); const base = { mois: r.mois, lib: r.lib, cat: r.cat, montant: typeof r.montant === 'number' ? r.montant : Number(r.montant) }; return Object.assign({ id: 'r' + r.row, row: r.row, date: r.date || null, livret: r.livret || null, y: p ? p.y : null, m: p ? p.m : null, srv: Object.assign({}, base, { montant: r.montant }) }, base); });
}

/* ================= THÈME ================= */
function appliquerTheme() {
  const t = LS.get('theme', 'auto');
  const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  document.querySelector('meta[name=theme-color]').content = dark ? '#0F0F0E' : '#2C2C2A';
  try { appliquerCosmetiques(); } catch (e) { /* modules pas encore chargés au tout premier appel */ }
}
appliquerTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', appliquerTheme);

/* ================= API ================= */
function api(action, extra) {
  const body = JSON.stringify(Object.assign({ action, key: S.key }, extra || {}));
  if (IN_GAS) return new Promise((res, rej) => google.script.run.withSuccessHandler(t => res(JSON.parse(t))).withFailureHandler(rej).api(body));
  return fetch(S.api, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body, redirect: 'follow' })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
}
function setSync(s) { $('#dot').className = 'dot' + (s === 'sync' ? ' sync' : s === 'off' ? ' off' : ''); }

async function rafraichir(force) {
  if (!S.key) return;
  if (S.queue.length) return;
  if (!force && Date.now() - S.lastFetch < 20000) return;
  S.lastFetch = Date.now();
  const gen = S.gen || 0;
  try {
    const r = await api('data');
    if (!r.ok) { if (r.error === 'CLE' || r.error === 'SANS_CLE') return verrouiller(r.message); throw new Error(r.message); }
    // Une écriture a eu lieu pendant la lecture : ces données sont déjà périmées, on les ignore.
    if (S.queue.length || (S.gen || 0) !== gen) { S.lastFetch = 0; return; }
    S.data = prepData(r.data);
    S.journal = entriesFromData(r.data);
    sauver(); setSync('ok');
    rendre(true);
  } catch (e) { setSync('off'); }
}

/* ================= FILE D'ÉCRITURES (optimiste) ================= */
const pick = e => ({ mois: e.mois, lib: e.lib, cat: e.cat, montant: e.montant });
const pickEch = e => ({ lib: e.lib, cat: e.cat, montant: e.montant, freq: e.freq, jour: e.jour, f: e.f, g: e.g, h: e.h, i: e.i, pause: !!e.pause });
const trouverEch = id => S.data && S.data.echeancier.find(e => e.id === id);
const trouver = id => S.journal.find(e => e.id === id);
function enfiler(op) { S.queue.push(op); sauver(); pomper(); }
async function pomper() {
  if (S.busy) return;
  const op = S.queue[0];
  if (!op) { setSync('ok'); setTimeout(() => rafraichir(true), 1500); return; }
  S.busy = true; setSync('sync');
  const J = ['add', 'update', 'delete'].includes(op.op);
  const e = J ? trouver(op.id) : null, x = op.op.startsWith('ech') ? trouverEch(op.id) : null;
  let res = { ok: true };
  try {
    if (op.op === 'call') {
      res = await api(op.action, op.payload);
      const P = op.payload || {}, de = op.action === 'cat-edit' ? P.ancien : op.action === 'cat-del' ? P.nom : null, vers = op.action === 'cat-edit' ? P.nom : P.cible;
      if (res.ok && de && vers && de !== vers) { S.journal.forEach(z => { if (z.srv && z.srv.cat === de) z.srv.cat = vers; }); S.data.echeancier.forEach(z => { if (z.srv && z.srv.cat === de) z.srv.cat = vers; }); }
    }
    else if (op.op === 'ech-save') {
      if (x) { res = await api('ech-save', { row: x.ligne || null, attendu: x.srv, e: pickEch(x) }); if (res.ok) { x.ligne = res.row; x.srv = { lib: x.lib, cat: x.cat, montant: x.montant }; } }
    } else if (op.op === 'ech-del') {
      if (x && x.ligne) { res = await api('ech-del', { row: x.ligne, attendu: x.srv }); }
      if (res.ok) S.data.echeancier = S.data.echeancier.filter(z => z !== x);
    }
    else if (op.op.startsWith('av-')) {
      const a = trouverAv(op.id);
      if (a && op.op === 'av-save') { res = await api('av-save', { row: a.row || null, attendu: a.srv, a: { mois: a.mois, lib: a.lib, cat: a.cat, montant: a.montant, jour: a.jour } }); if (res.ok) { a.row = res.row; a.srv = { lib: a.lib, cat: a.cat, montant: a.montant }; a.pending = false; } }
      else if (a && op.op === 'av-del') { if (a.row) res = await api('av-del', { row: a.row, attendu: a.srv }); if (res.ok) S.data.avenir = S.data.avenir.filter(z => z !== a); }
      else if (a && op.op === 'av-paye') { const j = trouver(op.jid); if (j) { res = await api('av-paye', { row: a.row, attendu: a.srv, ligne: Object.assign(pick(j), { date: j.date || null }) }); if (res.ok) { j.row = res.row; j.srv = pick(j); j.pending = false; } } }
    }
    else if (!e) res = { ok: true };
    else if (op.op === 'add') {
      res = await api('add', { ligne: Object.assign(pick(e), { date: e.date || null, livret: e.livret || null }) });
      if (res.ok) { e.row = res.row; e.srv = pick(e); }
    } else if (op.op === 'update') {
      if (e.row != null) { res = await api('update', { row: e.row, attendu: e.srv, ligne: Object.assign(pick(e), { livret: e.livret || null }) }); if (res.ok) e.srv = pick(e); }
    } else if (op.op === 'delete') {
      if (e.row != null) {
        res = await api('delete', { row: e.row, attendu: e.srv });
        if (res.ok) { const r0 = e.row; S.journal = S.journal.filter(x => x !== e); if (res.decale) S.journal.forEach(x => { if (x.row != null && x.row > r0) x.row--; }); }
      } else S.journal = S.journal.filter(x => x !== e);
    }
  } catch (err) {
    S.busy = false; setSync('off'); setTimeout(pomper, 8000); return;
  }
  S.queue.shift(); S.gen = (S.gen || 0) + 1;
  if (res && typeof res.patrimoine === 'string' && res.patrimoine.startsWith('erreur')) toast('Budget enregistré, mais le report vers ton patrimoine a échoué (' + res.patrimoine.slice(9) + ')');
  if (e && !S.queue.some(o => o.id === e.id)) e.pending = false;
  if (x && !S.queue.some(o => o.id === x.id)) x.pending = false;
  S.busy = false;
  if (!res.ok) {
    if (res.error === 'CLE') { sauver(); return verrouiller(res.message); }
    const vieux = /Action inconnue/.test(res.message || '');
    toast(vieux ? "Pas enregistré : ton Apps Script n'est pas à jour (Gérer les déploiements > Nouvelle version)" : 'Pas enregistré dans le fichier : ' + (res.message || 'erreur'));
    sauver(); rendre(true); pomper(); return;
  }
  sauver(); rendre(true); pomper();
}

/* ================= CALCULS ================= */
let memo = new Map();
function cats() {
  if (!S.data) return [];
  const o = LS.get('ordre', []), pos = n => { const i = o.indexOf(n); return i < 0 ? 1e4 : i; };
  return S.data.categories.map((c, i) => [c, i]).sort((a, b) => (pos(a[0].nom) - pos(b[0].nom)) || (a[1] - b[1])).map(x => x[0]);
}
function catMap() { const o = {}; cats().forEach((c, i) => o[c.nom] = Object.assign({ ordre: i }, c)); return o; }
function debut() { return S.data && S.data.debut ? new Date(S.data.debut + 'T00:00:00') : null; }
function echMontant(e, y, m, brut) {
  if (!e.lib || e.pause || e.deleted || typeof e.montant !== 'number') return 0;
  const d0 = brut ? null : debut(); if (d0 && new Date(y, m - 1, 1) < d0) return 0;
  if (e.h && y < e.h) return 0; if (e.i && y > e.i) return 0;
  const f = Math.max(1, e.f || 1), g = e.g || 12;
  const c1 = (e.h && y > e.h) || m >= f, c2 = (e.i && y < e.i) || m <= g;
  const p = { Mensuel: 1, Trimestriel: 3, Semestriel: 6 }[e.freq] || 12;
  return c1 && c2 && (((m - f) % p) + p) % p === 0 ? e.montant : 0;
}
function calc(y, m) {
  const k = y + '-' + m; if (memo.has(k)) return memo.get(k);
  const cm = catMap(), par = {};
  const add = (cat, j, ec) => { if (!cm[cat]) return; par[cat] = par[cat] || { j: 0, e: 0 }; par[cat].j += j; par[cat].e += ec; };
  S.journal.forEach(e => { if (!e.deleted && e.y === y && e.m === m && e.montant) add(e.cat, e.montant, 0); });
  (S.data ? S.data.echeancier : []).forEach(e => { const v = echMontant(e, y, m); if (v) add(e.cat, 0, v); });
  let rev = 0, fix = 0, vr = 0, ep = 0, av = 0, jvar = 0, budVar = 0, pv = 0, pf = 0, pr = 0;
  Object.keys(par).forEach(n => {
    const c = cm[n], t = par[n].j + par[n].e;
    if (estAv(n)) av += t;
    else if (c.type === 'Revenu') rev += t;
    else if (c.type === 'Épargne') ep += t;
    else if (c.type === 'Retrait') ep -= t;
    else if (FIX.includes(c.groupe)) fix += t;
    else if (VAR.includes(c.groupe)) { vr += t; jvar += par[n].j; budVar += par[n].e; }
  });
  cats().forEach(c => { if (VAR.includes(c.groupe) && c.type === 'Dépense' && c.budget > 0) budVar += c.budget; });
  if (y * 12 + m >= nowYM()) ((S.data && S.data.avenir) || []).forEach(a => {
    if (a.fait || a.deleted || a.y !== y || a.m !== m) return; const c = cm[a.cat]; if (!c) return;
    if (c.type === 'Revenu' || c.type === 'Retrait') pr += a.montant; else if (VAR.includes(c.groupe) && c.type === 'Dépense') pv += a.montant; else pf += a.montant;
  });
  const r = { par, rev, fix, vr, ep, av, jvar, budVar, pv, pf, pr, dep: fix + vr };
  r.restant = rev - r.dep - ep - av;
  r.dispo = rev - fix - ep;
  memo.set(k, r); return r;
}
function statut(y, m) { const a = y * 12 + m, b = now.getFullYear() * 12 + now.getMonth() + 1; return a < b ? 'passe' : a === b ? 'cours' : 'futur'; }
function bilan(y, m) {
  const c = calc(y, m), st = statut(y, m);
  const prevVar = st === 'passe' ? c.vr : Math.max(c.budVar, c.vr + c.pv);
  const reste = prevVar - c.vr, autres = st === 'passe' ? 0 : c.pf - c.pr;
  return Object.assign({}, c, { st, prevVar, resteBud: reste, fin: c.restant - reste - autres, frac: c.dispo > 0 ? Math.max(0, Math.min(1, c.restant / c.dispo)) : 0 });
}
// « Non dépensé » = revenus − dépenses (l'épargne placée compte comme non dépensée), comme dans le fichier.
function nonDepense(y) {
  const cy = now.getFullYear(); if (y > cy) return null;
  const last = y < cy ? 12 : now.getMonth() + 1; let t = 0;
  for (let k = 1; k <= last; k++) { const c = calc(y, k); t += c.restant + c.ep + c.av; }
  return t;
}
function projAnnee(y) { let t = 0; for (let k = 1; k <= 12; k++) { const b = bilan(y, k); t += (b.st === 'passe' ? b.restant : b.fin) + b.ep; } return t; }
function aPrelever(y, m) {
  const st = statut(y, m); if (st === 'passe') return null;
  const d = now.getDate(); let t = 0;
  occurrences(y, m).forEach(o => { if (o.type !== 'Revenu' && o.type !== 'Retrait' && (st === 'futur' || o.jour >= d)) t += o.v; });
  avenirMois(y, m).forEach(a => { const c = catMap()[a.cat]; if (c && c.type !== 'Revenu' && c.type !== 'Retrait') t += a.montant; });
  return t;
}
const seuil = () => LS.get('seuil', 0.85);
// Ce qu'on peut encore dépenser par jour d'ici la fin du mois en cours (revenus − charges − épargne − déjà dépensé − achats prévus).
function parJour() {
  const b = bilan(now.getFullYear(), now.getMonth() + 1), j = dim(now.getFullYear(), now.getMonth() + 1) - now.getDate() + 1;
  const marge = b.restant - (b.pv + b.pf - b.pr);
  return { marge, jours: j, v: marge / j };
}
// Un mois « existe » s'il a des données et n'est pas avant le début de l'Échéancier.
// Un mois compte dans les bilans et les séries dès qu'il contient des données (Journal ou Échéancier).
function moisActif(y, m) { const c = calc(y, m); return c.rev > 0 || c.dep > 0; }
function reculer(y, m) { return m > 1 ? [y, m - 1] : [y - 1, 12]; }
// Mois terminés d'affilée dans le vert (reste ≥ 0)
function serieVert() {
  let [y, m] = reculer(now.getFullYear(), now.getMonth() + 1), n = 0;
  while (n < 60 && moisActif(y, m) && calc(y, m).restant + calc(y, m).av >= -0.5) { n++; [y, m] = reculer(y, m); }
  return n;
}
// Mois terminés d'affilée où ce budget est tenu (pour un budget annuel : dans le rythme à fin de mois)
function serieBudget(nom) {
  let [y, m] = reculer(now.getFullYear(), now.getMonth() + 1), n = 0;
  while (n < 60 && moisActif(y, m)) { const b = budgetDe(nom, y, m); if (!b || b.reste < -0.5) break; n++; [y, m] = reculer(y, m); }
  return n;
}
// Jours sans dépense courante : suivi sur ce téléphone (le Journal n'a pas de date au jour près).
const auj = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
function noterDepenseDuJour() { LS.set('derDep', auj()); }
function estCourante(cat) { const c = catMap()[cat]; return !!c && c.type === 'Dépense' && VAR.includes(c.groupe); }
// Jours complets sans dépense courante (aujourd'hui n'est compté qu'une fois fini). Date de saisie = colonne « Saisi le » du Journal.
function joursSansDepense() {
  if (!LS.get('serieDepuis', null)) LS.set('serieDepuis', auj());
  const datees = S.journal.filter(e => !e.deleted && e.date);
  let der = LS.get('derDep', null);
  datees.forEach(e => { if (estCourante(e.cat) && e.montant > 0 && (!der || e.date > der)) der = e.date; });
  let dep = LS.get('serieDepuis', auj()); datees.forEach(e => { if (e.date < dep) dep = e.date; });
  const t = new Date(auj() + 'T00:00:00'), ecart = x => Math.round((t - new Date(x + 'T00:00:00')) / 864e5);
  return der ? Math.max(0, ecart(der) - 1) : ecart(dep);
}
function recordSans() { const j = joursSansDepense(), r = Math.max(LS.get('recordSans', 0), j); if (r !== LS.get('recordSans', 0)) LS.set('recordSans', r); return r; }
// ---- Avances : qui te doit combien (tous mois confondus) ----
const personne = lib => String(lib || '').split(' · ')[0].trim();
function avances() {
  const P = {};
  S.journal.filter(e => !e.deleted && estAv(e.cat) && e.montant).sort((a, b) => (a.y * 12 + a.m) - (b.y * 12 + b.m))
    .forEach(e => { const n = personne(e.lib) || '?'; const p = P[n] = P[n] || { nom: n, du: 0, ouverts: [] };
      p.du += e.montant;
      if (e.montant > 0) p.ouverts.push({ lib: String(e.lib).split(' · ').slice(1).join(' · ') || 'avance', v: e.montant, y: e.y, m: e.m });
      else { let r = -e.montant; while (r > 0.005 && p.ouverts.length) { const o = p.ouverts[0], x = Math.min(o.v, r); o.v -= x; r -= x; if (o.v < 0.005) p.ouverts.shift(); } } });

function stepEch(k, d) {
  const f = S.form, mens = f.freq === 'Mensuel', cy = now.getFullYear(), cm = now.getMonth() + 1;
  if (k === 'jour') f.jour = ((f.jour - 1 + d + 31) % 31) + 1;
  else if (k === 'f') f.f = ((f.f - 1 + d + 12) % 12) + 1;
  else if (k === 'nm') { const t = f.ny * 12 + f.nm - 1 + d; f.ny = Math.floor(t / 12); f.nm = (t % 12) + 1; }
  else if (k === 'deb' || k === 'fin') {
    const Y = k === 'deb' ? 'h' : 'i', M = k === 'deb' ? 'f' : 'g';
    if (d === 'x') { f[Y] = null; if (mens) f[M] = k === 'deb' ? 1 : 12; }
    else if (!f[Y]) { f[Y] = cy; if (mens) f[M] = cm; }
    else if (mens) { let t = f[Y] * 12 + f[M] - 1 + d; f[Y] = Math.floor(t / 12); f[M] = (t % 12) + 1; }
    else f[Y] += d;
  }
  rendreEch();
}

/* ---- solde ---- */
function soldeCalcule(y, m, base) {
  const s0 = base != null ? base : soldeDepart(y); if (s0 == null) return null;
  let t = s0; for (let k = 1; k < m; k++) t += calc(y, k).restant;
  if (statut(y, m) !== 'cours') return t + calc(y, m).restant;
  const cm = catMap(), d = now.getDate();
  S.journal.forEach(e => { const c = cm[e.cat]; if (!e.deleted && c && e.y === y && e.m === m && e.montant) t += signe(c.type) * e.montant; });
  occurrences(y, m).forEach(o => { if (o.jour <= d) t += signe(o.type) * o.v; });
  return t;
}

    case 'ech': { const x = trouverEch(el.dataset.id); if (x) ouvrirEch(x, !!el.dataset.ctx); break; }
    case 'ech-reel': ecartReel(); break;
    case 'ech-nouv': nouveauMontant(); break;
    case 'av': { const a = trouverAv(el.dataset.id); if (a) ouvrirAv(a); break; }
    case 'av-allcat': S.form.all = !S.form.all; rendreAv(); break;
    case 'av-cat': S.form.cat = el.dataset.cat; S.form.all = false; rendreAv(); break;
    case 'avs': { const f = S.form, d = +el.dataset.d; if (el.dataset.s === 'm') { const t = f.y * 12 + f.m - 1 + d; f.y = Math.floor(t / 12); f.m = (t % 12) + 1; } else f.jour = f.jour == null ? (d > 0 ? 1 : 31) : (f.jour + d < 1 || f.jour + d > 31 ? null : f.jour + d); rendreAv(); break; }
    case 'av-save': avEnregistrer(); break;
    case 'av-paye': avPayer(); break;
    case 'av-del': avSupprimer(); break;
    case 'mgrid': S.form = { mode: 'mois', y: S.y }; rendreForm(); ouvrirSheet(); break;
    case 'mg:today': S.y = now.getFullYear(); S.m = now.getMonth() + 1; fermer(); rendre(); break;
    case 'jmode': S.jmode = S.jmode === 'solde' ? 'reste' : 'solde'; S.lastBig = null; rendre(true); break;
    case 'stats-an': S.tab = 'stats'; S.statsVue = 'annee'; rendre(); scrollTo(0, 0); break;
    case 'sv:annee': S.statsVue = 'annee'; rendre(true); break;
    case 'sv:mois': S.statsVue = 'mois'; rendre(true); break;
    case 'sv:progres': S.tab = 'stats'; S.statsVue = 'progres'; rendre(); scrollTo(0, 0); break;
    case 'defi-go': ouvrirDefi(); break;
    case 'defi-cat': S.form.cat = el.dataset.cat; if (!S.form.touche) S.form.montant = defiSuggere(S.form.cat); rendreDefi(); break;
    case 'defi-ok': okDefi(); break;
    case 'defi-del': if (!S.form.arm) { S.form.arm = true; rendreDefi(); } else retirerDefi(); break;
    case 'gomois': S.m = +el.dataset.m; S.tab = 'home'; rendre(); scrollTo(0, 0); break;
    case 'fiche': S.form = { mode: 'fiche', cat: el.dataset.cat }; rendreForm(); ouvrirSheet(); break;
    case 'fiche-journal': { const c = S.form.cat; fermer(); S.filtre = { cat: c, q: '', grp: null }; S.tab = 'journal'; rendre(); scrollTo(0, 0); break; }
    case 'bilan-ok': LS.set('bilanVu', el.dataset.key); rendre(true); break;
    case 'bilan-stats': S.y = +el.dataset.y; S.m = +el.dataset.m; S.tab = 'stats'; S.statsVue = 'mois'; rendre(); scrollTo(0, 0); break;
    case 'allcat': S.allCat = !S.allCat; rendre(true); break;
    case 'pin': { const p = LS.get('pins', []), n = el.dataset.cat; LS.set('pins', p.includes(n) ? p.filter(x => x !== n) : p.concat([n])); rendreCats(); break; }
    case 'ordreBud': LS.set('ordreBud', el.dataset.t); rendreReglages(); rendre(true); break;
    case 'seuil': LS.set('seuil', +el.dataset.t); rendreReglages(); rendre(true); break;
    case 'discret': LS.set('discret', !LS.get('discret', false)); if (S.form && S.form.mode === 'reglages') rendreReglages(); rendre(true); break;
    case 'vibre': LS.set('vibre', !LS.get('vibre', true)); rendreReglages(); break;
    case 'dup': { const e = trouver(S.form.id); if (e) ouvrirSaisie(e, true); break; }
    case 'sgn': S.form.montant = S.form.montant.startsWith('-') ? S.form.montant.slice(1) : '-' + (S.form.montant || ''); majHint(); break;
    case 'libsug': S.form.lib = el.dataset.l; $('#lib').value = el.dataset.l; break;
    case 'hist-clear': if (!S.form.armH) { S.form.armH = true; rendreSolde(); } else { LS.set('controles', []); S.form.armH = false; toast('Historique vidé'); rendreSolde(); } break;
    case 'dep-calc': departCalcule(); break;
    case 'ech-new': ouvrirEch(null); break;
    case 'ech-allcat': S.form.all = !S.form.all; rendreEch(); break;
    case 'ech-cat': S.form.cat = el.dataset.cat; S.form.all = false; rendreEch(); break;
    case 'ech-freq': S.form.freq = el.dataset.t; if (S.form.freq !== 'Mensuel') S.form.g = 12; rendreEch(); break;
    case 'ech-pause': S.form.pause = !S.form.pause; rendreEch(); break;
    case 'stp': stepEch(el.dataset.s, el.dataset.d === 'x' ? 'x' : +el.dataset.d); break;
    case 'ech-save': enregistrerEch(false); break;
    case 'ech-stop': enregistrerEch(true); break;
    case 'ech-del': if (!S.form.arm) { S.form.arm = true; rendreEch(); } else { const x = trouverEch(S.form.id); fermer(); if (x) { x.deleted = true; x.pending = true; rendre(true); toast('Ligne supprimée'); enfiler({ op: 'ech-del', id: x.id }); } } break;
    case 'bud-edit': { const c = cats().find(x => x.nom === el.dataset.cat); S.form.edit = c.nom; S.form.val = txtNum(c.budget); S.form.suivi = c.suivi || 'Mensuel'; rendreBudgets(); break; }
    case 'bud-suivi': S.form.suivi = el.dataset.t; rendreBudgets(); break;
    case 'bud-ok': okBudget(); break;
    case 'cat-new': ouvrirCat(null); break;
    case 'cat-open': ouvrirCat(el.dataset.cat); break;
    case 'cat-mv': deplacerCat(el.dataset.cat, +el.dataset.d); break;
    case 'cat-g': S.form.groupe = el.dataset.t; rendreCatEdit(); break;
    case 'cat-suivi': S.form.suivi = el.dataset.t; rendreCatEdit(); break;
    case 'cat-cible': S.form.cible = el.dataset.cat; S.form.arm = false; rendreCatEdit(); break;
    case 'cat-save': enregistrerCat(); break;
    case 'cat-del': retirerCat(); break;
    case 's-neg': S.form.neg = !S.form.neg; rendreSolde(); break;
    case 's-ok': okSolde(); break;
    case 'dep-ok': okDepart(); break;
    case 'theme': LS.set('theme', el.dataset.t); appliquerTheme(); rendreReglages(); break;
    case 'refresh': fermer(); rafraichir(true); toast('Actualisation…'); break;
    case 'logout': if (!S.form.armOut) { S.form.armOut = true; rendreReglages(); } else { fermer(); oublierCompte(); rendre(); verrouiller(); } break;
    case 'go:lien': S.form = { mode: 'lien', url: S.api }; rendreForm(); break;
    case 'lien-ok': okLien(); break;
  }
});
(function tirerPourActualiser() {
  let y0 = null, ok = false; const ind = $('#ptr');
  document.addEventListener('touchstart', e => { y0 = (window.scrollY <= 0 && !$('#sheet').classList.contains('on')) ? e.touches[0].clientY : null; ok = false; }, { passive: true });
  document.addEventListener('touchmove', e => { if (y0 == null) return; ok = e.touches[0].clientY - y0 > 80; ind.classList.toggle('on', ok); }, { passive: true });
  document.addEventListener('touchend', () => { if (ok) { S.lastFetch = 0; rafraichir(true); pomper(); toast('Actualisation…'); vibrer(); } ind.classList.remove('on'); y0 = null; ok = false; });
})();
document.addEventListener('visibilitychange', () => { if (!document.hidden) { const avant = now.toDateString(); majDate(); if (now.toDateString() !== avant || avant !== new Date().toDateString()) rendre(); rafraichir(false); pomper(); } });

/* ================= DÉMARRAGE ================= */
if (!S.key || (!IN_GAS && !S.api)) verrouiller(); else { rendre(); rafraichir(true); pomper(); if (/[?&]saisie=1/.test(location.search)) ouvrirSaisie(null); }
if (!IN_GAS && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
